<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask & MongoDB Submission Form</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <section class="card">
      <p class="eyebrow">DEVOPS ASSIGNMENT</p>
      <h1>Flask &amp; MongoDB Atlas</h1>
      <p class="intro">Submit the form to store your details in MongoDB Atlas.</p>

      {% if error %}
      <div class="alert" role="alert">{{ error }}</div>
      {% endif %}

      <form action="{{ url_for('submit') }}" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required maxlength="100"
               value="{{ form_data.get('name', '') }}" placeholder="Your full name">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required maxlength="254"
               value="{{ form_data.get('email', '') }}" placeholder="you@example.com">

        <label for="message">Message</label>
        <textarea id="message" name="message" required maxlength="2000"
                  placeholder="Write a short message">{{ form_data.get('message', '') }}</textarea>

        <button type="submit">Submit data</button>
      </form>
      <p class="api-note">API endpoint: <a href="{{ url_for('api') }}">/api</a></p>
    </section>
  </main>
</body>
</html>
